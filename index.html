<!DOCTYPE html>
<html>
<head>
<title>你个乐乐</title>
<style>
body{
    background:#f6f8fa;
    text-align:center;
}
</style>
</head>
<body>
<h1>你是一个小乐乐</h1>
<p>乐乐
 
读音：lè le
 
含义
 
1本义
快乐、喜乐，叠词代表永远开心、无忧无虑。
取自“快乐”，寓意一生欢喜，没有烦恼。
2.用作小名最常见
男女都能用，偏软萌，简单好听。
 
- 寓意：平安喜乐，自在欢愉。
 
延伸
 
古文相关：
《道德经》：众人熙熙，如享太牢。众人乐乐。
代表安然愉悦。
 
小区别
 
- 乐乐（lè le）=快乐
- 乐乐（yuè yuè）：和音乐相关（很少用作名字读法）
日常人名、小名一律读 lè le
 
如果你想用在宝宝名字/猫咪名字，我可以搭配相关名字！</p>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>输入弹窗演示</title>
</head>
<body>
<script>
// 弹出输入框
let text = prompt("请输入名字：");

// 判断用户有没有输入
if (text !== null) {
    if (text.trim() === "") {
        alert("你没有输入任何文字！");
    } else {
        alert("你输入的内容：" + text);
    }
} else {
    // 用户点击【取消】
    alert("你点击了取消");
}
</script>
</body>
</html>
